<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Transaction - EVSU-OC IGP</title>
    <script src="../assets/js/auth.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-[#F8F9FA] flex min-h-screen">
    <div id="sidebar-container"></div>

    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <div id="header-container"></div>

        <div class="flex flex-1 overflow-hidden">
            
            <div class="w-full lg:w-3/5 p-8 overflow-y-auto border-r border-gray-100">
                <header class="mb-8">
                    <h1 class="text-2xl font-bold text-gray-800">New Transaction</h1>
                    <p class="text-sm text-gray-500">Step 1: Input Details & Select Items</p>
                </header>

                <section class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-10 bg-gray-50 p-6 rounded-2xl border border-gray-100">
                    <div class="col-span-full mb-2">
                        <h3 class="text-xs font-black text-[#800000] uppercase tracking-widest">Student Information</h3>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Full Name</label>
                        <input type="text" id="studentName" placeholder="Enter student name" 
                            class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-[#800000] outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Program / Course</label>
                        <select id="studentProgram" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-[#800000] outline-none text-sm bg-white">
                            <option value="">Select Program</option>
                            <option value="BSIT">BS Information Technology</option>
                            <option value="BSCE">BS Civil Engineering</option>
                            <option value="BSHRM">BS Hospitality Management</option>
                            <option value="BSED">Bachelor of Secondary Education</option>
                        </select>
                    </div>
                </section>

                <section>
                    <div class="flex justify-between items-center mb-4">
                        <!-- Increased font size from text-xs to text-sm and added font-semibold -->
                        <h3 class="text-sm font-semibold text-[#800000] uppercase tracking-widest">Select Items</h3>
                        
                        <!-- Increased width from w-48 to w-64 -->
                        <div class="relative w-64">
                        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 w-4 h-4"></i>
                        <!-- Increased padding py-1.5 to py-2 for height -->
                        <input type="text" id="itemSearch" placeholder="Search..." class="w-full pl-9 pr-3 py-2 border border-gray-200 rounded-lg text-sm outline-none">
                        </div>
                    </div>
                    
                    <div id="itemGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                </div>
                </section>
            </div>

            <div class="w-full lg:w-2/5 p-8 bg-[#FDFDFD] flex flex-col shadow-inner">
                <div class="mb-8">
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Official Receipt (OR) Number</label>
                    <input type="text" id="orNumber" placeholder="OR-000000" 
                        class="w-full p-4 bg-white border-2 border-dashed border-gray-200 rounded-2xl focus:border-[#800000] focus:ring-0 outline-none font-mono text-xl text-[#800000]">
                </div>

                <div class="flex items-center justify-between mb-4">
                    <h2 class="font-bold text-gray-800 flex items-center gap-2">
                        <i data-lucide="shopping-cart" class="w-4 h-4 text-[#800000]"></i> Cart Summary
                    </h2>
                    <span id="cartCount" class="bg-[#800000] text-white text-[10px] px-2 py-1 rounded-full font-bold">0 Items</span>
                </div>

                <div id="cartList" class="flex-1 overflow-y-auto space-y-3 mb-6 pr-2">
                    <div class="text-center py-20 text-gray-300">
                        <i data-lucide="shopping-bag" class="w-12 h-12 mx-auto mb-2 opacity-10"></i>
                        <p class="text-xs uppercase font-bold tracking-widest">No items added</p>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-3xl border border-gray-100 shadow-xl shadow-gray-200/50">
                    <div class="flex justify-between items-center mb-6">
                        <span class="text-gray-400 font-medium">Grand Total</span>
                        <span id="totalDisplay" class="text-3xl font-black text-gray-800 tracking-tight">₱0.00</span>
                    </div>
                    <button id="btnConfirm" class="w-full bg-[#800000] text-white py-4 rounded-2xl font-bold hover:bg-[#600000] transition-all transform active:scale-95 flex items-center justify-center gap-3">
                        <i data-lucide="check-circle" class="w-5 h-5"></i> Confirm Order
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- Global modal container for response modals -->
    <div id="modal-container"></div>

    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/search-filter.js"></script>
    <script src="../assets/js/components.js"></script>
    <script src="../assets/js/transactions.js"></script>
</body>
</html>
