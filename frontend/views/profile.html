<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings - EVSU-OC IGP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-[#F8F9FA] flex min-h-screen">
    <div id="sidebar-container"></div>

    <main class="flex-1 flex flex-col min-w-0">
        <div id="header-container"></div>

        <div class="p-6 lg:p-10 max-w-5xl mx-auto w-full">
            <div class="mb-8 flex items-center gap-4">
                <button onclick="history.back()" class="p-3 bg-white rounded-xl shadow-sm border border-gray-100 hover:bg-gray-50 transition-all text-gray-600 hover:text-[#800000]">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </button>
                <div>
                    <h1 class="text-3xl font-extrabold text-gray-800 tracking-tight flex items-center gap-3">
                        <i data-lucide="user-circle" class="w-8 h-8 text-[#800000]"></i> My Profile
                    </h1>
                </div>
            </div>

            <div class="flex flex-col space-y-8">
                
                <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100">
                    <div class="border-b border-gray-100 pb-4 mb-6">
                        <h2 class="text-sm font-black text-gray-800 uppercase tracking-widest flex items-center gap-2">
                            <i data-lucide="info" class="w-4 h-4 text-[#800000]"></i> Profile Information
                        </h2>
                    </div>
                    
                    <form id="profileForm" class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-center">
                            <label class="text-xs font-bold text-gray-500 uppercase">Full Name:</label>
                            <div class="md:col-span-2 flex gap-4">
                                <input type="text" id="profileName" required class="flex-1 px-4 py-3 bg-gray-50 border border-gray-100 rounded-xl focus:ring-2 focus:ring-[#800000] outline-none transition-all text-gray-800 font-medium">
                                <button type="submit" id="btnSaveProfile" class="bg-gray-800 hover:bg-gray-900 text-white px-6 py-3 rounded-xl font-bold text-sm shadow-md active:scale-95 transition-all whitespace-nowrap">
                                    Update Name
                                </button>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-center">
                            <label class="text-xs font-bold text-gray-500 uppercase">Email:</label>
                            <div class="md:col-span-2">
                                <input type="email" id="profileEmail" disabled class="w-full px-4 py-3 bg-gray-100 border border-gray-200 text-gray-500 rounded-xl cursor-not-allowed font-medium">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-center">
                            <label class="text-xs font-bold text-gray-500 uppercase">Role:</label>
                            <div class="md:col-span-2">
                                <input type="text" id="profileRole" disabled class="w-full px-4 py-3 bg-gray-100 border border-gray-200 text-gray-500 rounded-xl cursor-not-allowed font-medium">
                            </div>
                        </div>
                    </form>
                </div>

                <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100">
                    <div class="border-b border-gray-100 pb-4 mb-6">
                        <h2 class="text-sm font-black text-gray-800 uppercase tracking-widest flex items-center gap-2">
                            <i data-lucide="lock" class="w-4 h-4 text-[#800000]"></i> Change Password
                        </h2>
                    </div>

                    <form id="passwordForm" class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-center">
                            <label class="text-xs font-bold text-gray-500 uppercase">Current Password:</label>
                            <div class="md:col-span-2">
                                <input type="password" id="currentPassword" required class="w-full max-w-md px-4 py-3 bg-gray-50 border border-gray-100 rounded-xl focus:ring-2 focus:ring-[#800000] outline-none transition-all">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-start">
                            <label class="text-xs font-bold text-gray-500 uppercase mt-4">New Password:</label>
                            <div class="md:col-span-2">
                                <input type="password" id="newPassword" required class="w-full max-w-md px-4 py-3 bg-gray-50 border border-gray-100 rounded-xl focus:ring-2 focus:ring-[#800000] outline-none transition-all">
                                <p class="text-[10px] text-gray-400 mt-2 max-w-md">
                                    Password must be at least 8 characters with uppercase, lowercase, number, and special character.
                                </p>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-center">
                            <label class="text-xs font-bold text-gray-500 uppercase">Confirm Password:</label>
                            <div class="md:col-span-2">
                                <input type="password" id="confirmPassword" required class="w-full max-w-md px-4 py-3 bg-gray-50 border border-gray-100 rounded-xl focus:ring-2 focus:ring-[#800000] outline-none transition-all">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 pt-4">
                            <div class="hidden md:block"></div>
                            <div class="md:col-span-2">
                                <button type="submit" id="btnSavePassword" class="w-full max-w-md bg-[#800000] hover:bg-[#600000] text-white px-6 py-4 rounded-xl font-bold text-sm shadow-lg active:scale-95 transition-all uppercase tracking-wider">
                                    Update Password
                                </button>
                            </div>
                        </div>
                    </form>
                </div>

                <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100">
                    <div class="border-b border-gray-100 pb-4 mb-6">
                        <h2 class="text-sm font-black text-gray-800 uppercase tracking-widest flex items-center gap-2">
                            <i data-lucide="activity" class="w-4 h-4 text-gray-400"></i> Recent Activity (Optional)
                        </h2>
                    </div>
                    
                    <div class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-center">
                            <label class="text-xs font-bold text-gray-500 uppercase">Last Login:</label>
                            <div class="md:col-span-2">
                                <span class="text-sm font-medium text-gray-800" id="lastLoginDisplay">Just now</span>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-center">
                            <label class="text-xs font-bold text-gray-500 uppercase">Last Action:</label>
                            <div class="md:col-span-2">
                                <span class="text-sm font-medium text-gray-800">Updated profile settings</span>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <div id="modal-container"></div>

    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/components.js"></script> 
    <script src="../assets/js/profile.js"></script>
</body>
</html>
