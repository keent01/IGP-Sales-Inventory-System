<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - EVSU-OC IGP</title>
    <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
    <script src="../assets/js/auth.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-[#F3F4F6] flex min-h-screen">
    
    <div id="sidebar-container"></div>
    
    
    <main class="flex-1 flex flex-col">

    <div id="header-container"></div>
        <div class="p-6 lg:p-8">
           <div class="flex flex-wrap justify-between items-center mb-8 gap-4">
                <div>
                    <h1 class="text-3xl font-bold text-gray-800 tracking-tight">Dashboard Overview</h1>
                    <p class="text-sm text-gray-500 flex items-center gap-2 mt-1">
                        <span id="currentDateDisplay">Loading date...</span>
                    </p>
                </div>
                <div class="flex gap-3">
                    <a href="transactions.html" class="bg-[#800000] text-white px-6 py-3 rounded-lg text-sm font-bold hover:bg-[#600000] shadow-lg shadow-red-900/20 transition-all active:scale-95 inline-flex items-center gap-2">
                        <i data-lucide="plus" class="w-4 h-4"></i> Record New Sale
                    </a>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 hover:shadow-md transition-all">
                    <div class="flex items-center justify-between mb-4">
                        <div class="p-3 bg-green-50 rounded-lg text-green-600 font-bold text-xl">₱</div>
                        <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wide">Today's Sales</span>
                    </div>
                    <h2 id="todaySales" class="text-2xl font-bold text-gray-800 tracking-tight">₱0.00</h2>
                    <p class="text-xs text-gray-500 mt-2">Total revenue today</p>
                </div>

                <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 hover:shadow-md transition-all">
                    <div class="flex items-center justify-between mb-4">
                        <div class="p-3 bg-blue-50 rounded-lg text-blue-600">
                            <i data-lucide="shopping-cart" class="w-6 h-6"></i>
                        </div>
                        <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wide">Items Sold</span>
                    </div>
                    <h2 id="totalItemsSold" class="text-2xl font-bold text-gray-800 tracking-tight">0</h2>
                    <p class="text-xs text-gray-500 mt-2">Sold today</p>
                </div>

                <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 hover:shadow-md transition-all">
                    <div class="flex items-center justify-between mb-4">
                        <div class="p-3 bg-red-50 rounded-lg text-red-600">
                            <i data-lucide="alert-triangle" class="w-6 h-6"></i>
                        </div>
                        <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wide">Low Stock</span>
                    </div>
                    <h2 id="lowStockCount" class="text-2xl font-bold text-red-600 tracking-tight">0</h2>
                    <p class="text-xs text-gray-500 mt-2">Items below threshold</p>
                </div>

                <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 hover:shadow-md transition-all">
                    <div class="flex items-center justify-between mb-4">
                        <div class="p-3 bg-amber-50 rounded-lg text-amber-600">
                            <i data-lucide="award" class="w-6 h-6"></i>
                        </div>
                        <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wide">Top Item</span>
                    </div>
                    <h2 id="dashTopItemName" class="text-xl font-bold text-gray-800 tracking-tight truncate">---</h2>
                    <p id="dashTopItemQty" class="text-xs text-gray-500 mt-2">0 sold today</p>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-2 bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                    <div class="p-6 border-b border-gray-100 flex justify-between items-center">
                        <h3 class="text-lg font-bold text-gray-800">Recent Transactions</h3>
                        <a href="history.html" class="text-sm font-semibold text-[#800000] hover:text-[#600000] transition">View All →</a>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-gray-50 text-[10px] font-bold text-gray-600 uppercase">
                                <tr>
                                    <th class="px-6 py-4">Date</th>
                                    <th class="px-6 py-4">OR Number</th>
                                    <th class="px-6 py-4">Amount</th>
                                    <th class="px-6 py-4">Status</th>
                                </tr>
                            </thead>
                            <tbody id="recentSalesTable" class="divide-y divide-gray-100">
                                </tbody>
                        </table>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                    <div class="pb-4 border-b border-gray-100 flex justify-between items-center mb-4">
                        <h3 class="text-lg font-bold text-gray-800">Inventory Summary</h3>
                        <a href="inventory.html" class="text-sm font-semibold text-[#800000] hover:text-[#600000] transition">View All →</a>
                    </div>
                    <div id="categorySummary" class="space-y-3">
                        </div>
                    
                </div>
            </div>
        </div>
    </main>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/components.js"></script>
    <script src="../assets/js/dashboard.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
