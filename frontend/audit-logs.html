<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Logs - EVSU-OC IGP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-[#F8F9FA] flex min-h-screen">
    <div id="sidebar-container"></div>

    <main class="flex-1 flex flex-col min-w-0">
        <div id="header-container"></div>

        <div class="p-6 lg:p-10 max-w-7xl w-full mx-auto">
            <header class="flex justify-between items-center mb-10">
                <div>
                    <h1 class="text-3xl font-extrabold text-gray-800 tracking-tight">Audit Logs</h1>
                    <p class="text-gray-500 text-sm">Monitor all system activities and administrative actions.</p>
                </div>
                <button onclick="exportLogs()" class="bg-gray-100 text-gray-700 px-5 py-2.5 rounded-xl font-bold text-sm flex items-center gap-2 hover:bg-gray-200 transition-all">
                    <i data-lucide="download" class="w-4 h-4"></i> Export CSV
                </button>
            </header>

            <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-gray-50 border-b border-gray-100 text-[10px] font-black text-gray-400 uppercase tracking-widest">
                        <tr>
                            <th class="px-8 py-5">Timestamp</th>
                            <th class="px-8 py-5">User</th>
                            <th class="px-8 py-5">Action</th>
                            <th class="px-8 py-5">Module</th>
                            <th class="px-8 py-5">Details</th>
                        </tr>
                    </thead>
                    <tbody id="auditLogBody" class="divide-y divide-gray-50 text-sm text-gray-700">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/components.js"></script>
    <script src="../assets/js/audit-logs.js"></script>
</body>
</html>
