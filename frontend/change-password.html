<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - EVSU-OC IGP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body  class="bg-gradient-to-br from-[#800000] to-[#600000] min-h-screen flex items-center justify-center p-4">

    <main>

        <div class="p-6 lg:p-10 max-w-3xl w-full mx-auto">
            <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-8">
                <div class="mb-6">
                    <h1 class="text-3xl font-extrabold text-gray-800">Secure Your Account</h1>
                    <p class="text-gray-500 mt-2">A temporary password was sent to your @evsu.edu.ph email. You must update your password before continuing.</p>
                </div>

                <div id="alertMessage"></div>

                <form id="changePasswordForm" class="space-y-5">
                    <div>
                        <label class="block text-[10px] font-black text-gray-400 uppercase mb-2">New Password</label>
                        <input type="password" id="newPassword" required class="w-full px-4 py-3 bg-gray-50 border border-gray-100 rounded-xl focus:ring-2 focus:ring-[#800000] outline-none transition-all">
                    </div>

                    <div>
                        <label class="block text-[10px] font-black text-gray-400 uppercase mb-2">Confirm New Password</label>
                        <input type="password" id="confirmPassword" required class="w-full px-4 py-3 bg-gray-50 border border-gray-100 rounded-xl focus:ring-2 focus:ring-[#800000] outline-none transition-all">
                    </div>

                    <div class="flex gap-3 mt-8">
                        <button type="button" onclick="AuthService.logout()" class="flex-1 px-6 py-3 rounded-xl font-bold text-sm text-gray-500 hover:bg-gray-100">Cancel</button>
                        <button type="submit" id="changePasswordBtn" class="flex-1 bg-[#800000] text-white px-6 py-3 rounded-xl font-bold text-sm shadow-lg active:scale-95 transition-all">Update Password</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="assets/js/utils.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/change-password.js"></script>
</body>
</html>
