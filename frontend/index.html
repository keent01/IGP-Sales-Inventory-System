<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EVSU-OC IGP</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
    
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script>
        (function() {
            // Initialize EmailJS with your Public Key
            emailjs.init("UPB_Oxbe3Zge0ckGL");
        })();
    </script>
</head>
<body class="bg-gradient-to-br from-[#800000] to-[#600000] min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm">
        <!-- Card Container -->
        <div class="bg-white rounded-2xl shadow-2xl overflow-hidden border border-gray-100">
            <!-- Header Section -->
            <div class="bg-gradient-to-r from-[#800000] to-[#600000] px-8 py-12 text-center">
                <img src="assets/images/evsulogo.png" alt="EVSU Logo" class="mx-auto w-20 mb-4">
                <h1 class="text-3xl font-bold text-white tracking-tight">EVSU-OC</h1>
                <p class="text-sm text-red-100 mt-2 font-medium tracking-wide uppercase">IGP Sales & Inventory Management</p>
            </div>

            <!-- Form Section -->
            <div class="p-8">
                <div id="alertMessage" class="hidden mb-6 p-4 text-sm font-semibold rounded-lg border-l-4 animate-pulse"></div>

                <form id="loginForm" class="space-y-6">
                    <!-- Email Field -->
                    <div>
                        <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-2">Email Address</label>
                        <input type="email" id="email" required placeholder="admin@evsu.edu.ph"
                            class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg text-sm font-medium focus:bg-white focus:ring-2 focus:ring-[#800000] focus:border-transparent outline-none transition-all placeholder:text-gray-400">
                    </div>

                    <!-- Password Field -->
                    <div>
                        <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-2">Password</label>
                        <input type="password" id="password" required placeholder="••••••••"
                            class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg text-sm font-medium focus:bg-white focus:ring-2 focus:ring-[#800000] focus:border-transparent outline-none transition-all placeholder:text-gray-400">
                    </div>
                    
                    <!-- Submit Button -->
                    <button type="submit" id="loginBtn" class="w-full bg-gradient-to-r from-[#800000] to-[#600000] text-white py-3 rounded-lg font-bold text-sm uppercase tracking-wide hover:shadow-lg transition-all active:scale-95 flex justify-center items-center gap-2 mt-8">
                        <span id="btnText">Log In</span>
                    </button>

                    <div class="class=flex justify-end w-full mb-6">
                        <a href="#" onclick="openForgotModal()" class="text-sm text-red-600 hover:underline">Forgot Password?</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    
    <div id="forgotPasswordModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 relative border border-gray-100">
            <button onclick="closeForgotModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>

            <h3 class="text-lg font-bold text-[#800000] mb-2">Account Recovery</h3>
            <p class="text-xs text-gray-500 mb-4">Follow the steps below to securely reset your password.</p>

            <div id="forgotStep1" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">EVSU Email Address</label>
                    <input type="email" id="forgotEmail" placeholder="username@evsu.edu.ph" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-[#800000]">
                </div>
                <button id="btnSendOtp" onclick="handleRequestOtp()" 
                    class="w-full bg-[#800000] text-white text-sm font-semibold py-2 rounded-lg hover:bg-[#600000] transition-colors">
                    Send OTP
                </button>
            </div>

            <div id="forgotStep2" class="space-y-4 hidden">
                <p class="text-xs text-green-700 bg-green-50 p-2.5 rounded border border-green-200">
                    An OTP has been sent to your email inbox. Please check your messages.
                </p>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Enter 6-Digit OTP</label>
                    <input type="text" id="inputOtp" maxlength="6" placeholder="000000" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-center font-mono text-lg tracking-widest focus:outline-none focus:ring-1 focus:ring-[#800000]">
                </div>
                <button onclick="handleVerifyOtp()" 
                    class="w-full bg-[#800000] text-white text-sm font-semibold py-2 rounded-lg hover:bg-[#600000] transition-colors">
                    Verify Code
                </button>
            </div>

            <div id="forgotStep3" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">New Password</label>
                    <input type="password" id="forgotNewPassword" placeholder="••••••••" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-[#800000]">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Confirm New Password</label>
                    <input type="password" id="forgotConfirmPassword" placeholder="••••••••" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-[#800000]">
                </div>
                <button id="btnResetPassword" onclick="handleUpdatePassword()" 
                    class="w-full bg-green-700 text-white text-sm font-semibold py-2 rounded-lg hover:bg-green-800 transition-colors">
                    Update Password
                </button>
            </div>
        </div>
    </div>

    <div id="forgotAlertModal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-[60] p-4 animate-fade-in">
        <div class="bg-white rounded-xl max-w-sm w-full p-5 text-center shadow-2xl border border-gray-100">
            <div id="forgotAlertIcon" class="mx-auto flex items-center justify-center h-12 w-12 rounded-full mb-3"></div>
            <h3 id="forgotAlertTitle" class="text-base font-bold text-gray-900 mb-1"></h3>
            <div id="forgotAlertMessage" class="text-xs text-gray-500 mb-4 leading-relaxed"></div>
            <button onclick="closeForgotAlert()" class="w-full bg-gray-900 text-white text-xs font-semibold py-2 rounded-lg hover:bg-gray-800 transition-colors">
                Dismiss
            </button>
        </div>
    </div>

    <script src="assets/js/forgot-password.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/login.js"></script>
</body>
</html>
