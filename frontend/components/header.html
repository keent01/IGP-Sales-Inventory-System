<header class="bg-white border-b border-gray-100 px-8 py-4 flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center gap-3">
        
    </div>

    <div class="relative">
        <button id="profileDropdownBtn" class="flex items-center gap-3 hover:bg-gray-50 rounded-xl transition-all">
            <div class="text-right hidden sm:block">
                <p id="navUserName" class="text-sm font-bold text-gray-800 leading-none">Loading...</p>
                <p id="navUserRole" class="text-[10px] font-black text-gray-400 uppercase tracking-widest mt-1">Role</p>
            </div>
            <div class="w-10 h-10 rounded-lg bg-[#800000] text-white flex items-center justify-center font-bold shadow-md shadow-red-900/20">
                <span id="userInitials">U</span>
            </div>
            <i data-lucide="chevron-down" class="w-4 h-4 text-gray-400"></i>
        </button>

        <div id="profileDropdown" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-2xl shadow-xl border border-gray-100 py-2 z-[60]">
            <a href="profile.html" class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 transition-colors">
                <i data-lucide="user" class="w-4 h-4"></i> Profile Settings
            </a>
            <hr class="my-1 border-gray-50">
            <button onclick="AuthService.logout()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 transition-colors">
                <i data-lucide="log-out" class="w-4 h-4"></i> Log Out
            </button>
        </div>
    </div>
</header>
